name: Epic
description: Outcome-sized subtree with gradable exit criteria (planner-owned).
title: "Epic: "
labels: ["type:epic"]
body:
  - type: markdown
    attributes:
      value: |
        Epics are planner-owned. File design + leaf children; do not implement
        the whole epic in one agent turn.
        Standard: https://github.com/lbliii/elbysodic/blob/main/docs/plan/issue-lifecycle.md
        After create: add pillar, category, wave, and priority labels.
  - type: input
    id: parent_saga
    attributes:
      label: Parent saga
      description: Issue number.
      placeholder: "141"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: One paragraph — what is true when this epic closes.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: What is in / out for this subtree.
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Decisions already made
      description: ADR links, or “none — child design issues will freeze X”.
      placeholder: "ADR 0001; design #62"
    validations:
      required: true
  - type: textarea
    id: child_map
    attributes:
      label: Child map
      description: Design + leaf issues, or “to be filed after design”.
    validations:
      required: true
  - type: textarea
    id: exit
    attributes:
      label: Exit criteria
      description: Gradable checks (tests, canaries, docs + links). Prefer machine grades.
    validations:
      required: true
