name: Bug
description: Defect with repro — treated as a leaf for ownership and acceptance.
title: ""
labels: ["bug", "type:leaf"]
body:
  - type: markdown
    attributes:
      value: |
        Bugs follow the leaf lifecycle: owned paths + machine acceptance when fixed.
        Standard: https://github.com/lbliii/elbysodic/blob/main/docs/plan/issue-lifecycle.md
        The readiness and priority dropdowns are issue-body answers; they do not
        apply GitHub labels. After create, add exactly one of `ready` or
        `blocked` and the matching `priority:P0`–`priority:P3` label.
  - type: input
    id: parent
    attributes:
      label: Parent epic or design
      description: Issue number. Use a parent design only when this bug implements that freeze.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Repro
      description: Exact steps, curl, or test that fails today.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: owned_paths
    attributes:
      label: Likely owned paths
      description: Where the fix should land. Narrow if possible.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Machine acceptance
      description: Test or smoke that proves the fix.
      placeholder: uv run pytest path/to/test.py -q
    validations:
      required: true
  - type: dropdown
    id: readiness
    attributes:
      label: Readiness
      options:
        - blocked
        - ready
      default: 0
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P1
        - P0
        - P2
        - P3
      default: 0
    validations:
      required: true
