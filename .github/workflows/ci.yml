name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14t"

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Lint, format, typecheck, and template gates
        run: make check

      - name: Hypermedia contract drift (chirp diff)
        env:
          PYTHON_GIL: "0"
        run: make contract-diff CONTRACT_DIFF_BASE=origin/${{ github.base_ref || 'main' }}

      - name: Changelog enforcement
        run: make changelog-check

      - name: Validate changed changelog fragments
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.base_ref }}"
          FILES=$(git diff --name-only --diff-filter=ACMRT "$BASE"...HEAD -- 'changelog.d/*.md' || true)
          if [ -n "$FILES" ]; then
            uv run python scripts/check_changelog_fragments.py $FILES
          fi

      - name: Test suite with coverage
        env:
          PYTHON_GIL: "0"
        run: make test-cov
