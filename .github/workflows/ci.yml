name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14.2"

      - name: Cache uv dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Install Node for client behavior tests
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Lint, format, typecheck, and template gates
        run: make check

      - name: Hypermedia contract drift (chirp diff)
        run: make contract-diff CONTRACT_DIFF_BASE=origin/${{ github.base_ref || 'main' }}

      - name: Changelog enforcement
        run: make changelog-check

      - name: Validate changed changelog fragments
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.base_ref }}"
          FILES=$(git diff --name-only --diff-filter=ACMRT "$BASE"...HEAD -- 'changelog.d/*.md' || true)
          if [ -n "$FILES" ]; then
            uv run python scripts/check_changelog_fragments.py $FILES
          fi

  tests:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.14.2"
            gil: "1"
            free-threaded: "0"
          - python: "3.14.2t"
            gil: "0"
            free-threaded: "1"
    env:
      UV_PYTHON: ${{ matrix.python }}
      PYTHON_GIL: ${{ matrix.gil }}
      EXPECT_FREE_THREADED: ${{ matrix.free-threaded }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Cache uv dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Verify selected runtime
        run: |
          uv run python - <<'PY'
          import os
          import sys
          import sysconfig
          assert bool(sysconfig.get_config_var("Py_GIL_DISABLED")) == bool(int(os.environ["EXPECT_FREE_THREADED"]))
          assert sys._is_gil_enabled() == bool(int(os.environ["PYTHON_GIL"]))
          PY

      - name: Test suite with coverage
        run: make test-cov
