      <stop offset="0.5" stop-color="#40304b"/>
      <stop offset="1" stop-color="#bb7550"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#e4ad70" stop-opacity=".74"/>
      <stop offset="1" stop-color="#433b49" stop-opacity=".1"/>
    </linearGradient>
    <radialGradient id="afterglow">
